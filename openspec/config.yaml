schema: spec-driven
context: |
  Proyecto: tacometro digital TPI EDIII; C11, CLion, LPC1769/OM13085.
  Capas: Aplicacion, Servicios, Dispositivos; CMSISv2p00_LPC17xx existente.
  Build: objetos host y ELF ARM Cortex-M3 con startup/linker propios, B00.
  B11 wrapper Timer aceptado/archivado: tres funciones en Dispositivos, driver original intacto, Temporizacion.h eliminado; host17/17, ARM13/13, Doxygen35; pruebas físicas/enlace de biblioteca pendientes.
  Consigna: 0..185 RPM inclusive; maximo aclarado por el usuario.
  R15: dispositivos acceden directamente al hardware usando drivers originales; aplicación/servicios independientes de hardware; curva LM35 en dispositivo, servicio en Celsius/estado.
  Sonda: CMSIS-DAP integrado confirmado; revision fisica pendiente.
  Persistencia: archivos; B00-B16/B03-R1/B07-R1 aceptados/archivados; antecedentes B11-SysTick/TC-Tiempo descartados. B12 GPIO aceptado (selector P2.6, buzzer P2.7 altos; LED P0.22 bajo); salidas void(bool), host/san18/18, ARM13/13, Doxygen38. B07-R1 aceptado/archivado, salidas-alarma sincronizado: callbacks void(bool) sin contextos, ACEPTADA/ERROR_ARGUMENTO; host/san18/18,183 C, ARM13/13/fixture Release,Doxygen38. B13 aceptado/archivado, contrato uart-dispositivo sincronizado: UART_Read/Write NONE_BLOCKING, TX P0.2/RX P0.3, UART_BAUDRATE configurable sin aplicar; host/san19/19,194 C,ARM13/13,Doxygen40. B14 aceptado/archivado, contrato sensor-optico sincronizado: SensorOptico_Read por TIM_ReadTimer original; TIMER1/CAP1.0/P1.18, XD-51 confirmado y electricidad pendiente. Host/san20/20,200 C,ARM13/13,O0/O2,Doxygen41. B15 aceptado/archivado, contrato motor-dispositivo sincronizado: MR0 fijo1000 al integrar, Motor_Write envia mando0..1000 directo por PWM_MATCH_1, sin conversion/lecturaMR0/ajuste1001. Host/san21/21,204 C,ARM13/13,O0/O2,Doxygen42. B16 corregido aceptado/archivado2026-11-11, contrato potenciometro-dma sincronizado: uint16_t Pot_Read(void) devuelve RESULT0..4095 desde ADC_DMA_Pot definida en Potenciometro.c (extern interno para soporte ADC/DMA), una palabra volatile32bits .bss local; sin estados/validaciones/dato DMA del llamador. Canal AD0.0/P0.23 acordado. Host/san22/22,207 C+oraculo,ARM13/13,O0/O2/propiedad de simbolo,test sin soporte,Doxygen43; init/ADC-DMA real/lectura LM35/regulacion/enlace fisicos pendientes; sin push ni nuevo bloque acordado. Biblioteca/servicios intactos; sin init nuevo. Llamada desde aplicacion/main pendiente para el final. Inicializacion/enlace para el final; leer ESTADO al reanudar.
  B05-R1 implementado/verificado pendiente de auditoria y aceptacion: int32_t LM35_Read en centesimas, conversion interna con constantes nombradas/factor100/10 y redondeo B05, muestra propia, sin estados; TE2 intacto. ADC_VREF_MV ifndef/default2540 provisional/error; valor fisico al integrar. m1-m3 incorporados; test sin soporte y referencias publicas a resumen versionado del cambio. Host/san29/29,214 ejecuciones C,20480 comparaciones exactas,8 probes,ARM13/13,Doxygen43. Claude r2 aprobo propuesta, auditoria del codigo pendiente. Riesgo ADGDR/ADDRn/UM10360/erratas para integracion. USW11.3/11.4 nuevas;11.1/11.2 retiradas. Usuario autoriza commit de implementacion, sin cierre/sincronizacion/archivo/push.
rules:
  proposal:
    - Vincular origen, alcance, exclusiones, dependencias y aceptacion verificable.
  specs:
    - Usar MUST/SHALL/SHOULD/MAY y escenarios Given/When/Then.
    - Separar contratos candidatos de contratos vigentes aceptados.
  design:
    - Justificar unidades, limites, concurrencia y recursos pertinentes al bloque.
  tasks:
    - Usar checklist jerarquico y mantener bloques pequenos.
  apply:
    - Implementar solo el bloque acordado; preservar cambios locales y bibliotecas.
    - No instalar, flashear ni cambiar configuracion sensible sin autorizacion.
    - Documentar ESW/USW con IDs y contratos Doxygen en cada bloque.
    - Crear commit al cerrar bloque acordado; no inferir push.
  verify:
    - Registrar comandos ejecutados y distinguir host, ARM, simulacion y hardware.
    - Revisar diff y mantener logs extensos fuera del arbol versionado.
  archive:
    - Sincronizar y archivar solo tras aceptacion; no editar archivos archivados.
