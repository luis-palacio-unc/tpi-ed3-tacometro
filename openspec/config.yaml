schema: spec-driven
context: |
  Proyecto: tacometro digital TPI EDIII; C11, CLion, LPC1769/OM13085.
  Capas: Aplicacion, Servicios, Dispositivos; CMSISv2p00_LPC17xx existente.
  Build: objetos host y ELF ARM Cortex-M3 con startup/linker propios, B00.
  B11 wrapper Timer aceptado/archivado: tres funciones en Dispositivos, driver original intacto, Temporizacion.h eliminado; host17/17, ARM13/13, Doxygen35; pruebas físicas/enlace de biblioteca pendientes.
  Consigna: 0..185 RPM inclusive; maximo aclarado por el usuario.
  R15: dispositivos acceden directamente al hardware usando drivers originales; aplicación/servicios independientes de hardware; curva LM35 en dispositivo, servicio en Celsius/estado.
  Sonda: CMSIS-DAP integrado confirmado; revision fisica pendiente.
  Persistencia: archivos; B00-B16/B03-R1/B07-R1/B05-R1 aceptados/archivados; antecedentes B11-SysTick/TC-Tiempo descartados. B12 GPIO aceptado (selector P2.6, buzzer P2.7 altos; LED P0.22 bajo); salidas void(bool), host/san18/18, ARM13/13, Doxygen38. B07-R1 aceptado/archivado, salidas-alarma sincronizado: callbacks void(bool) sin contextos, ACEPTADA/ERROR_ARGUMENTO; host/san18/18,183 C, ARM13/13/fixture Release,Doxygen38. B13 aceptado/archivado, contrato uart-dispositivo sincronizado: UART_Read/Write NONE_BLOCKING, TX P0.2/RX P0.3, UART_BAUDRATE configurable sin aplicar; host/san19/19,194 C,ARM13/13,Doxygen40. B14 aceptado/archivado, contrato sensor-optico sincronizado: SensorOptico_Read por TIM_ReadTimer original; TIMER1/CAP1.0/P1.18, XD-51 confirmado y electricidad pendiente. Host/san20/20,200 C,ARM13/13,O0/O2,Doxygen41. B15 aceptado/archivado, contrato motor-dispositivo sincronizado: MR0 fijo1000 al integrar, Motor_Write envia mando0..1000 directo por PWM_MATCH_1, sin conversion/lecturaMR0/ajuste1001. Host/san21/21,204 C,ARM13/13,O0/O2,Doxygen42. B16 corregido aceptado/archivado2026-11-11, contrato potenciometro-dma sincronizado: uint16_t Pot_Read(void) devuelve RESULT0..4095 desde ADC_DMA_Pot definida en Potenciometro.c (extern interno para soporte ADC/DMA), una palabra volatile32bits .bss local; sin estados/validaciones/dato DMA del llamador. Canal AD0.0/P0.23 acordado. Host/san22/22,207 C+oraculo,ARM13/13,O0/O2/propiedad de simbolo,test sin soporte,Doxygen43; init/ADC-DMA real/regulacion/enlace fisicos pendientes; sin push ni nuevo bloque acordado. Biblioteca/servicios intactos; sin init nuevo. Llamada desde aplicacion/main pendiente para el final. Inicializacion/enlace para el final; leer ESTADO al reanudar.
  B05-R1 aceptado/cerrado/archivado2026-11-11 sobre94d3134: reauditoria Claude r2 APROBAR sin hallazgos abiertos. Contrato temperatura TE1/TE3/TE4 sincronizado; TE2/S4/S5 intactos. int32_t LM35_Read en centesimas, conversion interna entera con constantes nombradas/factor100/10 y redondeo B05, muestra propia, sin estados. ADC_VREF_MV ifndef/default2540 provisional/error; valor fisico al integrar. m1-m3 y correcciones H1/H2 aceptadas; test sin soporte y referencias publicas al resumen versionado archivado. Verificacion propia nueva de cierre: host/san29/29 cada uno,214 ejecuciones C,20480 comparaciones exactas y8 probes por modalidad,ARM13/13,Doxygen43 sin avisos. USW11.3/11.4 nuevas;11.1/11.2 retiradas. Riesgo ADGDR/ADDRn/UM10360/erratas y estado generico de fuente/primera muestra al integrar. Codigo/pruebas/build/Drivers e historial previo preservados en cierre. Inicializacion e integracion para el final, sin nuevo bloque acordado. Commit local de cierre autorizado, sin push.
  B17 implementado/verificado pendiente de /auditar B17 (r2) y aceptacion; propuesta r2 APROBAR, m1 resuelto en S1. API PI separada en Procesamiento (USW.2.1.2.8-10), productos int64_t,num/den1..1000,salida0..1000/anti-windup; retencion N sin integrar,reinicio descarta historia. Control.h ganancias/N,periodo500ms constante contractual sin Timer. Host/san33/33,133758 pasos exactos,25 probes,planta14/14,cinco mutaciones AW/truncado/limites/n0 detectadas,ARM15/15,Doxygen46;instancia40bytes. B01/B06/servicios/dispositivos/Drivers/specs aceptadas intactos. Correccion H1/H2 solo pruebas,produccion bf975f3 intacta;unidad10/10,ocho configuraciones Fraction. Evidencia workspace build/verificacion-b17-h1-h2-2026-11-11,ignorada;reproducir python3 scripts/verificar_b17.py --evidencia build/verificacion-b17-h1-h2-2026-11-11. Commit local autorizado,sin cierre/sincronizacion/archivo/push. Inicializacion/enlace/sintonia fisicos al final;sensor desconectado fuera de alcance.
rules:
  proposal:
    - Vincular origen, alcance, exclusiones, dependencias y aceptacion verificable.
  specs:
    - Usar MUST/SHALL/SHOULD/MAY y escenarios Given/When/Then.
    - Separar contratos candidatos de contratos vigentes aceptados.
  design:
    - Justificar unidades, limites, concurrencia y recursos pertinentes al bloque.
  tasks:
    - Usar checklist jerarquico y mantener bloques pequenos.
  apply:
    - Implementar solo el bloque acordado; preservar cambios locales y bibliotecas.
    - No instalar, flashear ni cambiar configuracion sensible sin autorizacion.
    - Documentar ESW/USW con IDs y contratos Doxygen en cada bloque.
    - Crear commit al cerrar bloque acordado; no inferir push.
  verify:
    - Registrar comandos ejecutados y distinguir host, ARM, simulacion y hardware.
    - Revisar diff y mantener logs extensos fuera del arbol versionado.
  archive:
    - Sincronizar y archivar solo tras aceptacion; no editar archivos archivados.
