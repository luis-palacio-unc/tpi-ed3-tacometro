schema: spec-driven
context: |
  Proyecto: tacometro digital TPI EDIII; C11, CLion, LPC1769/OM13085.
  Capas: Aplicacion, Servicios, Dispositivos; CMSISv2p00_LPC17xx existente.
  Build: objetos host y ELF ARM Cortex-M3 con startup/linker propios, B00.
  Pruebas B09: host 161 casos C, codec 5096 pares y B03-R1 11199 ternas, ARM 12/12; sanitizadores/Doxygen.
  Consigna: 0..185 RPM inclusive; maximo aclarado por el usuario.
  R15: servicios independientes de hardware; curva LM35 en dispositivo, servicio en Celsius/estado.
  Sonda: CMSIS-DAP integrado confirmado; revision fisica pendiente.
  Persistencia: archivos; B00-B08 y B03-R1 aceptados/archivados; B09 verificado pendiente de aceptacion, commit local autorizado sin push; leer ESTADO al reanudar.
rules:
  proposal:
    - Vincular origen, alcance, exclusiones, dependencias y aceptacion verificable.
  specs:
    - Usar MUST/SHALL/SHOULD/MAY y escenarios Given/When/Then.
    - Separar contratos candidatos de contratos vigentes aceptados.
  design:
    - Justificar unidades, limites, concurrencia y recursos pertinentes al bloque.
  tasks:
    - Usar checklist jerarquico y mantener bloques pequenos.
  apply:
    - Implementar solo el bloque acordado; preservar cambios locales y bibliotecas.
    - No instalar, flashear ni cambiar configuracion sensible sin autorizacion.
    - Documentar ESW/USW con IDs y contratos Doxygen en cada bloque.
    - Crear commit al cerrar bloque acordado; no inferir push.
  verify:
    - Registrar comandos ejecutados y distinguir host, ARM, simulacion y hardware.
    - Revisar diff y mantener logs extensos fuera del arbol versionado.
  archive:
    - Sincronizar y archivar solo tras aceptacion; no editar archivos archivados.
