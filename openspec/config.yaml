schema: spec-driven
context: |
  Proyecto: tacometro digital TPI EDIII; C11, CLion, LPC1769/OM13085.
  Capas: Aplicacion, Servicios, Dispositivos; CMSISv2p00_LPC17xx existente.
  Build: objetos host y ELF ARM Cortex-M3 con startup/linker propios, B00.
  B11 wrapper Timer aceptado/archivado: tres funciones en Dispositivos, driver original intacto, Temporizacion.h eliminado; host17/17, ARM13/13, Doxygen35; pruebas físicas/enlace de biblioteca pendientes.
  Consigna: 0..185 RPM inclusive; maximo aclarado por el usuario.
  R15: dispositivos acceden directamente al hardware usando drivers originales; aplicación/servicios independientes de hardware; curva LM35 en dispositivo, servicio en Celsius/estado.
  Sonda: CMSIS-DAP integrado confirmado; revision fisica pendiente.
  Persistencia: archivos; B00-B14/B03-R1/B07-R1 aceptados/archivados; antecedentes B11-SysTick/TC-Tiempo descartados. B12 GPIO aceptado (selector P2.6, buzzer P2.7 altos; LED P0.22 bajo); salidas void(bool), host/san18/18, ARM13/13, Doxygen38. B07-R1 aceptado/archivado, salidas-alarma sincronizado: callbacks void(bool) sin contextos, ACEPTADA/ERROR_ARGUMENTO; host/san18/18,183 C, ARM13/13/fixture Release,Doxygen38. B13 aceptado/archivado, contrato uart-dispositivo sincronizado: UART_Read/Write NONE_BLOCKING, TX P0.2/RX P0.3, UART_BAUDRATE configurable sin aplicar; host/san19/19,194 C,ARM13/13,Doxygen40. B14 aceptado/archivado, contrato sensor-optico sincronizado: SensorOptico_Read por TIM_ReadTimer original; TIMER1/CAP1.0/P1.18, XD-51 confirmado y electricidad pendiente. Host/san20/20,200 C,ARM13/13,O0/O2,Doxygen41. Activo B15 propuesto sin acuerdo/codigo/pruebas: Motor_Write mando por mil y periodo explicito; PWM1.1/P2.0 propuestos, driver PWM original; sin init/frecuencia/potencia/regulacion. Biblioteca/servicios intactos; sin init nuevo. Llamada desde aplicacion/main pendiente para el final. Inicializacion/enlace para el final; leer ESTADO al reanudar.
rules:
  proposal:
    - Vincular origen, alcance, exclusiones, dependencias y aceptacion verificable.
  specs:
    - Usar MUST/SHALL/SHOULD/MAY y escenarios Given/When/Then.
    - Separar contratos candidatos de contratos vigentes aceptados.
  design:
    - Justificar unidades, limites, concurrencia y recursos pertinentes al bloque.
  tasks:
    - Usar checklist jerarquico y mantener bloques pequenos.
  apply:
    - Implementar solo el bloque acordado; preservar cambios locales y bibliotecas.
    - No instalar, flashear ni cambiar configuracion sensible sin autorizacion.
    - Documentar ESW/USW con IDs y contratos Doxygen en cada bloque.
    - Crear commit al cerrar bloque acordado; no inferir push.
  verify:
    - Registrar comandos ejecutados y distinguir host, ARM, simulacion y hardware.
    - Revisar diff y mantener logs extensos fuera del arbol versionado.
  archive:
    - Sincronizar y archivar solo tras aceptacion; no editar archivos archivados.
